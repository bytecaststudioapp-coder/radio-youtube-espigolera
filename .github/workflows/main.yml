name: Radio 24/7 con Onda en Vivo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: radio-stream
  cancel-in-progress: true

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar imagen del repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Emitir Radio + Imagen + Onda Continua a YouTube
        env:
          YT_KEY: ${{ secrets.YOUTUBE_KEY }}
          STREAM_URL: ${{ secrets.RADIO_URL }}
        run: |
          while true; do
            ffmpeg -re -loop 1 -framerate 25 -i logo.jpg \
              -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -i "$STREAM_URL" \
              -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2[bg];[1:a]showwaves=s=1280x180:mode=cline:rate=25:colors=white@0.85[onda];[bg][onda]overlay=0:H-h-30[outv]" \
              -map "[outv]" -map 1:a \
              -c:v libx264 -preset veryfast -pix_fmt yuv420p \
              -b:v 2000k -maxrate 2000k -bufsize 4000k -g 50 \
              -c:a aac -b:a 128k -ar 44100 \
              -f flv "rtmp://a.rtmp.youtube.com/live2/$YT_KEY" || true
            echo "Reconectando en 5 segundos..."
            sleep 5
          done
