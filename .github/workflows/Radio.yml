
name: Radio 24/7 con Logo y Carteles

on:
  workflow_dispatch:

concurrency:
  group: radio-stream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  emitir:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Preparar archivos
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p musica carteles

          if [[ ! -f logo.jpg ]]; then
            echo "ERROR: Falta logo.jpg en la raíz del repositorio."
            exit 1
          fi

          if [[ ! -f rotulo.txt ]]; then
            echo "RADIO EN DIRECTO" > rotulo.txt
          fi

          echo "Archivos preparados."

      - name: Emitir radio en YouTube
        shell: bash
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${YOUTUBE_KEY:-}" ]]; then
            echo "ERROR: Falta el secreto YOUTUBE_KEY."
            exit 1
          fi

          RTMP="rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_KEY}"
          BG_IMAGE="$PWD/logo.jpg"
          CARTEL_VIDEO="$RUNNER_TEMP/carteles_video.mp4"
          CARTEL_DIR="$RUNNER_TEMP/carteles_preparados"
          CONCAT_FILE="$RUNNER_TEMP/carteles.txt"

          mkdir -p "$CARTEL_DIR"

          # ------------------------------------------
          # PREPARAR CARTELES: 30 SEGUNDOS CADA UNO
          # ------------------------------------------

          mapfile -d '' CARTEL_FILES < <(
            find carteles -maxdepth 1 -type f \
              \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) \
              -print0 | sort -z
          )

          HAY_CARTELES=0

          if (( ${#CARTEL_FILES[@]} > 0 )); then

            echo "Preparando ${#CARTEL_FILES[@]} carteles..."

            NUMERO=0

            for CARTEL in "${CARTEL_FILES[@]}"; do
              NUMERO=$((NUMERO + 1))
              printf -v NOMBRE "%04d.png" "$NUMERO"

              ffmpeg -hide_banner -loglevel error -y \
                -i "$CARTEL" \
                -frames:v 1 \
                -vf "scale=820:460:force_original_aspect_ratio=increase,crop=820:460,setsar=1,format=rgb24" \
                "$CARTEL_DIR/$NOMBRE"
            done

            : > "$CONCAT_FILE"

            for ((i=1; i<=NUMERO; i++)); do
              printf -v NOMBRE "%04d.png" "$i"
              printf "file '%s'\nduration 30\n" "$CARTEL_DIR/$NOMBRE" >> "$CONCAT_FILE"
            done

            # Repetir el último archivo para que el último cartel
            # también conserve sus 30 segundos completos.
            printf -v ULTIMO "%04d.png" "$NUMERO"
            printf "file '%s'\n" "$CARTEL_DIR/$ULTIMO" >> "$CONCAT_FILE"

            DURACION=$((NUMERO * 30))

            ffmpeg -hide_banner -loglevel error -y \
              -f concat -safe 0 \
              -i "$CONCAT_FILE" \
              -t "$DURACION" \
              -vf "fps=24,format=yuv420p" \
              -an \
              -c:v libx264 \
              -preset veryfast \
              -crf 23 \
              -pix_fmt yuv420p \
              "$CARTEL_VIDEO"

            HAY_CARTELES=1
            echo "Vídeo de carteles preparado: $DURACION segundos."

          else
            echo "No hay carteles. Se emitirá solamente el logo de fondo."
          fi

          # ------------------------------------------
          # LOCALIZAR PROMOCIONES Y CANCIONES
          # ------------------------------------------

          PROMOS=()

          for P in promo.mp4 promo1.mp4; do
            if [[ -f "$P" ]]; then
              PROMOS+=("$P")
            fi
          done

          mapfile -d '' CANCIONES < <(
            find musica -maxdepth 1 -type f \
              \( -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.aac' -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.flac' \) \
              -print0 | sort -z
          )

          if (( ${#CANCIONES[@]} == 0 )); then
            echo "ERROR: No hay canciones dentro de musica/."
            exit 1
          fi

          echo "Promociones encontradas: ${#PROMOS[@]}"
          echo "Canciones encontradas: ${#CANCIONES[@]}"

          # ------------------------------------------
          # EMITIR PROMOCIONES A PANTALLA COMPLETA
          # SIN EL LOGO DE FONDO
          # ------------------------------------------

          emitir_promo() {
            local VIDEO="$1"

            echo "Emitiendo promoción: $VIDEO"

            local AUDIO
            AUDIO=$(ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_type \
              -of csv=p=0 "$VIDEO" 2>/dev/null || true)

            if [[ -n "$AUDIO" ]]; then

              ffmpeg -hide_banner -loglevel warning \
                -re -i "$VIDEO" \
                -map 0:v:0 \
                -map 0:a:0 \
                -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1,fps=24,format=yuv420p" \
                -c:v libx264 \
                -preset veryfast \
                -b:v 2500k \
                -maxrate 3000k \
                -bufsize 6000k \
                -g 48 \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -max_muxing_queue_size 9999 \
                -f flv "$RTMP" || echo "Aviso: no se pudo completar $VIDEO"

            else

              ffmpeg -hide_banner -loglevel warning \
                -re -i "$VIDEO" \
                -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
                -map 0:v:0 \
                -map 1:a:0 \
                -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,setsar=1,fps=24,format=yuv420p" \
                -c:v libx264 \
                -preset veryfast \
                -b:v 2500k \
                -maxrate 3000k \
                -bufsize 6000k \
                -g 48 \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -shortest \
                -max_muxing_queue_size 9999 \
                -f flv "$RTMP" || echo "Aviso: no se pudo completar $VIDEO"

            fi
          }

          # ------------------------------------------
          # EMITIR CANCIONES
          # LOGO DE FONDO + CARTEL + ONDA + ROTULO
          # ------------------------------------------

          emitir_cancion() {
            local SONG="$1"

            echo "Emitiendo canción: $SONG"

            local AUDIO
            AUDIO=$(ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_type \
              -of csv=p=0 "$SONG" 2>/dev/null || true)

            if [[ -z "$AUDIO" ]]; then
              echo "Canción sin audio reconocible. Se omite: $SONG"
              return 0
            fi

            if (( HAY_CARTELES == 1 )); then

              # Entrada 0: logo de fondo.
              # Entrada 1: secuencia de carteles.
              # Entrada 2: canción.

              ffmpeg -hide_banner -loglevel warning \
                -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -stream_loop -1 -re -i "$CARTEL_VIDEO" \
                -re -i "$SONG" \
                -filter_complex "
                  [0:v]
                    scale=1280:720:force_original_aspect_ratio=increase,
                    crop=1280:720,
                    setsar=1
                    [fondo];

                  [1:v]
                    scale=820:460:force_original_aspect_ratio=increase,
                    crop=820:460,
                    setsar=1,
                    format=rgba
                    [cartel];

                  [fondo][cartel]
                    overlay=(W-w)/2:100
                    [base];

                  [2:a]
                    asplit=2[audio][onda_in];

                  [onda_in]
                    showwaves=s=1280x75:mode=line:rate=24:colors=white@0.85,
                    format=rgba
                    [onda];

                  [base][onda]
                    overlay=0:590
                    [con_onda];

                  [con_onda]
                    drawtext=
                      fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:
                      textfile=rotulo.txt:
                      reload=1:
                      fontcolor=white:
                      fontsize=25:
                      box=1:
                      boxcolor=black@0.45:
                      boxborderw=10:
                      x=w-mod(t*90\,w+tw):
                      y=h-38
                    [video]
                " \
                -map "[video]" \
                -map "[audio]" \
                -c:v libx264 \
                -preset veryfast \
                -b:v 2500k \
                -maxrate 3000k \
                -bufsize 6000k \
                -r 24 \
                -g 48 \
                -pix_fmt yuv420p \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -shortest \
                -max_muxing_queue_size 9999 \
                -flvflags no_duration_filesize \
                -f flv "$RTMP" || echo "Aviso: error al emitir $SONG"

            else

              # Sin carteles: el logo permanece como fondo.

              ffmpeg -hide_banner -loglevel warning \
                -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -re -i "$SONG" \
                -filter_complex "
                  [0:v]
                    scale=1280:720:force_original_aspect_ratio=increase,
                    crop=1280:720,
                    setsar=1
                    [fondo];

                  [1:a]
                    asplit=2[audio][onda_in];

                  [onda_in]
                    showwaves=s=1280x75:mode=line:rate=24:colors=white@0.85,
                    format=rgba
                    [onda];

                  [fondo][onda]
                    overlay=0:590
                    [con_onda];

                  [con_onda]
                    drawtext=
                      fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:
                      textfile=rotulo.txt:
                      reload=1:
                      fontcolor=white:
                      fontsize=25:
                      box=1:
                      boxcolor=black@0.45:
                      boxborderw=10:
                      x=w-mod(t*90\,w+tw):
                      y=h-38
                    [video]
                " \
                -map "[video]" \
                -map "[audio]" \
                -c:v libx264 \
                -preset veryfast \
                -b:v 2500k \
                -maxrate 3000k \
                -bufsize 6000k \
                -r 24 \
                -g 48 \
                -pix_fmt yuv420p \
                -c:a aac \
                -b:a 128k \
                -ar 44100 \
                -ac 2 \
                -shortest \
                -max_muxing_queue_size 9999 \
                -flvflags no_duration_filesize \
                -f flv "$RTMP" || echo "Aviso: error al emitir $SONG"

            fi
          }

          # ------------------------------------------
          # BUCLE DE EMISIÓN
          # ------------------------------------------

          INICIO=$SECONDS
          LIMITE=$((330 * 60))

          while (( SECONDS - INICIO < LIMITE )); do

            echo "Comienza un nuevo ciclo de emisión."

            # Las promociones son las únicas emisiones
            # que no utilizan logo.jpg de fondo.
            for PROMO in "${PROMOS[@]}"; do
              emitir_promo "$PROMO"
            done

            # Reproducir todas las canciones.
            for SONG in "${CANCIONES[@]}"; do

              if (( SECONDS - INICIO >= LIMITE )); then
                break
              fi

              emitir_cancion "$SONG"

            done

          done

          echo "Fin del periodo de emisión. Se solicitará otra ejecución."

      - name: Reiniciar emisión automáticamente
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run radio.yml --ref "$GITHUB_REF_NAME"
