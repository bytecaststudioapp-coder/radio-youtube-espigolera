
name: Radio 24/7 con Logo y Carteles

on:
  workflow_dispatch:

concurrency:
  group: radio-stream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Comprobar y preparar emisión
        env:
          YT_KEY: ${{ secrets.YOUTUBE_KEY }}
          TZ: Europe/Madrid
        shell: bash
        run: |
          set -Eeuo pipefail

          trap 'echo "Finalizando proceso..."; kill $(jobs -p) 2>/dev/null || true' SIGINT SIGTERM

          echo "================================"
          echo "       ESPIGOLERA RADIO TV"
          echo "================================"

          if [ -z "${YT_KEY:-}" ]; then
            echo "ERROR: Falta YOUTUBE_KEY"
            exit 1
          fi

          RTMP="rtmp://a.rtmp.youtube.com/live2/${YT_KEY}"

          # Emisión de 330 minutos.
          # Se deja margen para finalizar y relanzar antes del límite.
          FIN=$(( $(date +%s) + 19800 ))

          mkdir -p musica carteles

          echo "FFmpeg:"
          ffmpeg -version | head -1

          # ---------------------------------
          # 1. PREPARAR LOGO PERMANENTE
          # ---------------------------------

          echo "Preparando fondo..."

          if [ -s logo.jpg ]; then
            BG_IMAGE="logo.jpg"
          else
            echo "No existe logo.jpg. Creando fondo alternativo."

            ffmpeg -nostdin -y -loglevel error \
              -f lavfi -i "color=c=0x103050:s=1280x720" \
              -frames:v 1 fondo.jpg

            BG_IMAGE="fondo.jpg"
          fi

          # ---------------------------------
          # 2. ROTULO INFORMATIVO
          # ---------------------------------

          cat > rotulo.txt <<'EOF'
          *** ESPIGOLERA RADIO TV ***   PATROCINA RESTAURANTE CAN TIA TALECA DE LLUCMAJOR   |   TODOS LOS DOMINGO (20.00 h) En directo con Juan Rodriguez, El Poeta del Asfalto   |   MIERCOLES 04 DE NOVIEMBRE (17.00 h) Entrevista con Tomas Sastre   |   RESTO DE DIAS MUSICA ININTERRUMPIDA 24 HORAS   |   PRESENTA SANTIAGO MUÑOZ   ---
          EOF

          # ---------------------------------
          # 3. BUSCAR PROMOCIONES
          # ---------------------------------

          mapfile -d '' PROMOS < <(
            find . -maxdepth 1 -type f \
              -iname 'promo*.mp4' -print0 | sort -z
          )

          echo "Promociones encontradas: ${#PROMOS[@]}"

          # ---------------------------------
          # 4. BUSCAR CANCIONES
          # ---------------------------------

          mapfile -d '' CANCIONES < <(
            find musica -type f \
              \( -iname '*.mp3' -o -iname '*.mpeg' \
                 -o -iname '*.m4a' -o -iname '*.aac' \
                 -o -iname '*.ogg' -o -iname '*.wav' \
                 -o -iname '*.flac' \) \
              -size +100c -print0 | sort -z
          )

          if [ ${#CANCIONES[@]} -eq 0 ]; then
            echo "ERROR: No hay canciones."
            exit 1
          fi

          echo "Canciones encontradas: ${#CANCIONES[@]}"

          # ---------------------------------
          # 5. PREPARAR CARTELES
          # ---------------------------------

          preparar_video_carteles() {

            local D="carteles_tmp"
            local f p n=0
            local -a LISTA=()

            rm -rf "$D"
            mkdir -p "$D"

            mapfile -d '' LISTA < <(
              find carteles -type f \
                \( -iname '*.jpg' -o -iname '*.jpeg' \
                   -o -iname '*.png' -o -iname '*.webp' \) \
                -print0 | sort -z
            )

            if [ ${#LISTA[@]} -eq 0 ]; then
              echo "No hay carteles disponibles."
              rm -f carteles_video.mp4
              return 0
            fi

            : > "$D/secuencia.txt"

            for f in "${LISTA[@]}"; do

              p="$PWD/$D/$(printf '%04d' "$((n+1))").png"

              if ffmpeg -nostdin -y -loglevel error \
                -i "$f" \
                -vf "scale=820:460:force_original_aspect_ratio=decrease,pad=820:460:(ow-iw)/2:(oh-ih)/2:color=black,setsar=1" \
                -frames:v 1 "$p"; then

                n=$((n+1))

                printf "file '%s'\nduration 30\n" "$p" \
                  >> "$D/secuencia.txt"

                echo "Cartel preparado: $f"

              else
                echo "AVISO: No se pudo preparar $f"
              fi

            done

            if [ "$n" -eq 0 ]; then
              echo "No hay carteles válidos."
              rm -f carteles_video.mp4
              return 0
            fi

            # Duplicar primera imagen para completar
            # los 30 segundos del último cartel.

            printf "file '%s'\n" \
              "$PWD/$D/0001.png" >> "$D/secuencia.txt"

            echo "Creando vídeo continuo de carteles..."

            ffmpeg -nostdin -y -loglevel error \
              -f concat -safe 0 \
              -i "$D/secuencia.txt" \
              -t "$((n * 30))" \
              -vf "fps=24,format=yuv420p" \
              -c:v libx264 \
              -preset ultrafast \
              -crf 23 \
              -pix_fmt yuv420p \
              -an carteles_video.mp4

            echo "Carteles preparados: $n"
            echo "Duración de cada cartel: 30 segundos"
          }

          preparar_video_carteles

          # ---------------------------------
          # 6. EMITIR PROMOCIONES
          # LOGO SIEMPRE DE FONDO
          # ---------------------------------

          emitir_promo() {

            local VIDEO="$1"

            echo "Emitiendo promoción: $VIDEO"

            local AUDIO

            AUDIO=$(ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_type \
              -of csv=p=0 "$VIDEO" 2>/dev/null || true)

            if [ -n "$AUDIO" ]; then

              ffmpeg -nostdin -hide_banner -loglevel warning \
                -re -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -re -i "$VIDEO" \
                -filter_complex "
                  [0:v]scale=1280:720:force_original_aspect_ratio=decrease,
                  pad=1280:720:(ow-iw)/2:(oh-ih)/2,
                  format=yuv420p[bg];

                  [1:v]scale=1100:620:force_original_aspect_ratio=decrease,
                  setsar=1[promo];

                  [bg][promo]overlay=(W-w)/2:(H-h)/2[video];

                  [1:a:0]aresample=44100,
                  aformat=channel_layouts=mono[a]
                " \
                -map "[video]" -map "[a]" \
                -c:v libx264 -preset ultrafast \
                -pix_fmt yuv420p \
                -b:v 2500k -maxrate 2500k -bufsize 5000k \
                -r 24 -g 48 \
                -c:a aac -b:a 128k -ar 44100 -ac 1 \
                -shortest -f flv "$RTMP" \
                || echo "AVISO: Error en promoción."

            else

              ffmpeg -nostdin -hide_banner -loglevel warning \
                -re -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -re -i "$VIDEO" \
                -f lavfi -i anullsrc=r=44100:cl=mono \
                -filter_complex "
                  [0:v]scale=1280:720:force_original_aspect_ratio=decrease,
                  pad=1280:720:(ow-iw)/2:(oh-ih)/2,
                  format=yuv420p[bg];

                  [1:v]scale=1100:620:force_original_aspect_ratio=decrease,
                  setsar=1[promo];

                  [bg][promo]overlay=(W-w)/2:(H-h)/2[video]
                " \
                -map "[video]" -map 2:a:0 \
                -c:v libx264 -preset ultrafast \
                -pix_fmt yuv420p \
                -b:v 2500k -maxrate 2500k -bufsize 5000k \
                -r 24 -g 48 \
                -c:a aac -b:a 128k -ar 44100 -ac 1 \
                -shortest -f flv "$RTMP" \
                || echo "AVISO: Error en promoción."

            fi
          }

          # ---------------------------------
          # 7. EMITIR MUSICA
          # LOGO FIJO + CARTELES CADA 30S
          # ---------------------------------

          emitir_cancion() {

            local SONG="$1"
            local TOTAL_DUR

            echo "================================"
            echo "Reproduciendo canción: $SONG"
            echo "================================"

            TOTAL_DUR=$(ffprobe -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$SONG" 2>/dev/null | cut -d'.' -f1 || true)

            if [ -z "$TOTAL_DUR" ] || [ "$TOTAL_DUR" -le 0 ]; then
              TOTAL_DUR=180
            fi

            echo "Duración: ${TOTAL_DUR} segundos"

            if [ -s carteles_video.mp4 ]; then

              echo "Modo: LOGO + CARTELES CADA 30 SEGUNDOS"

              ffmpeg -nostdin -hide_banner -loglevel warning \
                -stats_period 30 -stats \
                -re -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -stream_loop -1 -re -i carteles_video.mp4 \
                -re -i "$SONG" \
                -filter_complex "
                  [0:v]
                  scale=1280:720:force_original_aspect_ratio=decrease,
                  pad=1280:720:(ow-iw)/2:(oh-ih)/2,
                  setsar=1,format=yuv420p[bg];

                  [1:v]
                  scale=820:460:force_original_aspect_ratio=decrease,
                  setsar=1[poster];

                  [bg][poster]
                  overlay=(W-w)/2:(H-h)/2-40[con_cartel];

                  [2:a:0]asplit=2[audio][wavein];

                  [wavein]
                  aresample=44100,
                  aformat=channel_layouts=mono,
                  showwaves=s=1280x110:mode=cline:rate=24:colors=white@0.85[onda];

                  [con_cartel][onda]
                  overlay=0:H-h-60[con_onda];

                  [con_onda]
                  drawbox=x=0:y=ih-48:w=iw:h=48:color=black@0.85:t=fill,
                  drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=rotulo.txt:reload=1:fontcolor=yellow:fontsize=25:y=h-35:x=w-mod(t*90\,w+tw)[outv];

                  [audio]
                  aresample=44100,
                  aformat=sample_fmts=s16:channel_layouts=mono[aout]
                " \
                -map "[outv]" -map "[aout]" \
                -t "$TOTAL_DUR" \
                -c:v libx264 -preset ultrafast \
                -pix_fmt yuv420p \
                -b:v 2500k -minrate 2500k \
                -maxrate 2500k -bufsize 5000k \
                -r 24 -g 48 \
                -c:a aac -b:a 128k -ar 44100 -ac 1 \
                -max_muxing_queue_size 9999 \
                -f flv "$RTMP" || {
                  echo "AVISO: Error durante la canción."
                }

            else

              echo "Modo: LOGO SIN CARTELES"

              ffmpeg -nostdin -hide_banner -loglevel warning \
                -stats_period 30 -stats \
                -re -loop 1 -framerate 24 -i "$BG_IMAGE" \
                -re -i "$SONG" \
                -filter_complex "
                  [0:v]
                  scale=1280:720:force_original_aspect_ratio=decrease,
                  pad=1280:720:(ow-iw)/2:(oh-ih)/2,
                  setsar=1,format=yuv420p[bg];

                  [1:a:0]asplit=2[audio][wavein];

                  [wavein]
                  aresample=44100,
                  aformat=channel_layouts=mono,
                  showwaves=s=1280x110:mode=cline:rate=24:colors=white@0.85[onda];

                  [bg][onda]overlay=0:H-h-60[con_onda];

                  [con_onda]
                  drawbox=x=0:y=ih-48:w=iw:h=48:color=black@0.85:t=fill,
                  drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=rotulo.txt:reload=1:fontcolor=yellow:fontsize=25:y=h-35:x=w-mod(t*90\,w+tw)[outv];

                  [audio]
                  aresample=44100,
                  aformat=sample_fmts=s16:channel_layouts=mono[aout]
                " \
                -map "[outv]" -map "[aout]" \
                -t "$TOTAL_DUR" \
                -c:v libx264 -preset ultrafast \
                -pix_fmt yuv420p \
                -b:v 2500k -minrate 2500k \
                -maxrate 2500k -bufsize 5000k \
                -r 24 -g 48 \
                -c:a aac -b:a 128k -ar 44100 -ac 1 \
                -max_muxing_queue_size 9999 \
                -f flv "$RTMP" || {
                  echo "AVISO: Error durante la canción."
                }

            fi
          }

          # ---------------------------------
          # 8. EMISION CONTINUA
          # ---------------------------------

          while [ "$(date +%s)" -lt "$FIN" ]; do

            echo "================================"
            echo "NUEVO CICLO MUSICAL"
            echo "================================"

            mapfile -d '' CANCIONES < <(
              find musica -type f \
                \( -iname '*.mp3' -o -iname '*.mpeg' \
                   -o -iname '*.m4a' -o -iname '*.aac' \
                   -o -iname '*.ogg' -o -iname '*.wav' \
                   -o -iname '*.flac' \) \
                -size +100c -print0 | shuf -z
            )

            if [ ${#CANCIONES[@]} -eq 0 ]; then
              echo "ERROR: No hay canciones."
              exit 1
            fi

            for VIDEO in "${PROMOS[@]}"; do

              if [ "$(date +%s)" -ge "$FIN" ]; then
                break
              fi

              emitir_promo "$VIDEO"

            done

            for SONG in "${CANCIONES[@]}"; do

              if [ "$(date +%s)" -ge "$FIN" ]; then
                break
              fi

              emitir_cancion "$SONG"

            done

            echo "Finalizado el ciclo musical."
            sleep 2

          done

          echo "================================"
          echo "TIEMPO DE EMISION COMPLETADO"
          echo "PREPARANDO RELANZAMIENTO"
          echo "================================"

      # ---------------------------------
      # 9. RELANZAMIENTO AUTOMATICO
      # ---------------------------------

      - name: Relanzar emisión automáticamente
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Programando nuevo ciclo de emisión..."

          gh workflow run radio.yml \
            --ref "$GITHUB_REF_NAME"

          echo "Nuevo ciclo solicitado correctamente."
