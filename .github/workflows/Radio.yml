name: Radio 24h Musica libre e informacion local

on:
  workflow_dispatch:
    inputs:
      fuente:
        description: 'Que emitir: musica (libre de derechos) o radio (senal de la emisora)'
        type: choice
        default: musica
        options:
          - musica
          - radio

concurrency:
  group: radio-stream
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y fuentes de texto
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Emitir musica, promos e informacion
        env:
          TZ: 'Europe/Madrid'
          YT_KEY: ${{ secrets.YOUTUBE_KEY }}
          STREAM_URL: ${{ secrets.RADIO_URL }}
          FUENTE: ${{ inputs.fuente }}
        run: |
          RTMP="rtmp://a.rtmp.youtube.com/live2/$YT_KEY"
          # Se detiene a los 325 min para dejar margen antes del limite de GitHub (350 min)
          FIN=$(( $(date +%s) + 19500 ))

          VF="scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p"
          OUT=(-c:v libx264 -preset ultrafast -pix_fmt yuv420p
               -b:v 2500k -minrate 2500k -maxrate 2500k -bufsize 5000k -r 24 -g 48
               -c:a aac -b:a 128k -ar 44100
               -f flv "$RTMP")

          echo "--- Archivos del repositorio ---"
          ls -la
          ls -la musica | head -50

          # ---------- 1. Preparar la musica (mismo formato y volumen) ----------
          if [ "$FUENTE" != "radio" ]; then
          mkdir -p norm
          i=0
          while IFS= read -r f; do
            i=$((i+1))
            ffmpeg -nostdin -loglevel error -y -i "$f" -vn -af loudnorm=I=-16:TP=-1.5:LRA=11 \
              -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "norm/$(printf '%04d' "$i").mp3" \
              || echo "!!! No se pudo convertir: $f"
          done < <(find musica -type f \( -iname '*.mp3' -o -iname '*.mpeg' -o -iname '*.mpga' -o -iname '*.mp2' -o -iname '*.mpg' -o -iname '*.m4a' -o -iname '*.aac' -o -iname '*.ogg' -o -iname '*.wav' -o -iname '*.flac' \) | sort)

          if ! ls norm/*.mp3 >/dev/null 2>&1; then
            echo "!!! No hay musica en la carpeta musica/. Sube archivos MP3 y vuelve a lanzar."
            exit 1
          fi
          echo "Pistas preparadas: $(ls norm/*.mp3 | wc -l)"
          fi
          echo "Fuente elegida: $FUENTE"

          # ---------- 2. Fondo: fondo.mp4 en bucle si existe, si no logo.jpg ----------
          if [ -f fondo.mp4 ]; then
            echo "Fondo: fondo.mp4 en bucle"
            BG=(-re -stream_loop -1 -i fondo.mp4)
          else
            echo "Fondo: logo.jpg"
            BG=(-re -loop 1 -framerate 24 -i logo.jpg)
          fi

          # ---------- 3. Rotulo con la informacion de info.txt ----------
          actualizar_rotulo() {
            local url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/info.txt"
            local txt
            txt=$(curl -fsS --max-time 15 "$url" 2>/dev/null || cat info.txt)
            txt=$(printf '%s\n' "$txt" | tr -d '\r' | grep -v '^[[:space:]]*$' | sed 's/%//g; s/\\//g' | paste -sd'|' | sed 's/|/   |   /g')
            printf '%s' "*** ESPIGOLERA RADIO TV ***   ${txt}   ---   " > rotulo.txt
            echo "Rotulo actualizado: $(wc -c < rotulo.txt) caracteres"
          }

          # ---------- 4. Videos promo ----------
          emitir_video() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "(no existe $f, se omite)"
              return
            fi
            echo "=== EMITIENDO $f ==="
            if ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$f" | grep -q audio; then
              ffmpeg -loglevel warning -re -i "$f" \
                -filter_complex "[0:v]${VF}[v_out];[0:a]aformat=sample_rates=44100:channel_layouts=mono[a_out]" \
                -map "[v_out]" -map "[a_out]" -t 180 \
                "${OUT[@]}" || echo "!!! ffmpeg fallo con $f"
            else
              ffmpeg -loglevel warning -re -i "$f" \
                -f lavfi -i anullsrc=r=44100:cl=mono \
                -filter_complex "[0:v]${VF}[v_out]" \
                -map "[v_out]" -map 1:a -t 180 -shortest \
                "${OUT[@]}" || echo "!!! ffmpeg fallo con $f"
            fi
          }

          # ---------- 5. Bloque de musica con onda y rotulo (20 min) ----------
          emitir_musica() {
            echo "=== EMITIENDO MUSICA ==="
            ls norm/*.mp3 | shuf | sed "s|^|file '$PWD/|; s|\$|'|" > lista.txt
            timeout 1300 ffmpeg -loglevel warning "${BG[@]}" \
              -re -stream_loop -1 -f concat -safe 0 -i lista.txt \
              -filter_complex "[0:v]${VF}[bg];[1:a]aformat=channel_layouts=mono,showwaves=s=1280x110:mode=cline:rate=24:colors=white@0.85[onda];[bg][onda]overlay=0:H-h-60[con_onda];[con_onda]drawbox=x=0:y=ih-48:w=iw:h=48:color=black@0.85:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=rotulo.txt:fontcolor=yellow:fontsize=25:y=h-35:x=w-mod(t*90\,w+tw)[outv]" \
              -map "[outv]" -map 1:a -t 1200 \
              "${OUT[@]}" || echo "!!! El bloque de musica termino con error"
          }

          # ---------- 6. Bloque de radio en directo con onda y rotulo (20 min) ----------
          emitir_radio() {
            echo "=== EMITIENDO RADIO ==="
            if [ -z "$STREAM_URL" ]; then
              echo "!!! Falta el secreto RADIO_URL"
              return
            fi
            timeout 1300 ffmpeg -loglevel warning "${BG[@]}" \
              -thread_queue_size 4096 -reconnect 1 -reconnect_at_eof 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
              -i "$STREAM_URL" \
              -filter_complex "[0:v]${VF}[bg];[1:a]aformat=channel_layouts=mono,showwaves=s=1280x110:mode=cline:rate=24:colors=white@0.85[onda];[bg][onda]overlay=0:H-h-60[con_onda];[con_onda]drawbox=x=0:y=ih-48:w=iw:h=48:color=black@0.85:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=rotulo.txt:fontcolor=yellow:fontsize=25:y=h-35:x=w-mod(t*90\,w+tw)[outv]" \
              -map "[outv]" -map 1:a -t 1200 \
              "${OUT[@]}" || echo "!!! El bloque de radio termino con error"
          }

          # ---------- Bucle principal ----------
          while [ "$(date +%s)" -lt "$FIN" ]; do
            actualizar_rotulo
            emitir_video promo.mp4
            emitir_video promo1.mp4
            if [ "$FUENTE" = "radio" ]; then
              emitir_radio
            else
              emitir_musica
            fi
            sleep 3
          done

      - name: Relanzar la emision automaticamente
        env:
          GH_TOKEN: ${{ github.token }}
          FUENTE: ${{ inputs.fuente }}
        run: gh workflow run "$GITHUB_WORKFLOW" -f fuente="$FUENTE"
